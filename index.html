<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tin tức Ba Đình theo tháng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: trang thông tin chính quyền — trang trọng, gọn, dễ bấm trên điện thoại.
IDEA: kệ báo của phường — số tháng này đặt nổi trên cùng, các số trước xếp gáy bên dưới.
PICTURE: "bìa" số tháng hiện tại, khối đỏ son lớn với số tháng to, danh sách link ngay trong bìa.
COLOUR and TYPE: đỏ son #a3161d, vàng rơm #f2c14e làm điểm nhấn, nền giấy trắng; Be Vietnam Pro.
LAYOUT: một cột, tối đa 760px; bìa tháng mới ở đầu, tìm kiếm, rồi kệ các tháng trước dạng gáy mở ra.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f7f5f2,#141012);--paper:light-dark(#ffffff,#1e191b);--ink:light-dark(#1c1415,#f3ecec);
--mute:light-dark(#6b5f60,#b7aaab);--line:light-dark(#e6dfdc,#3a3133);
--red:#a3161d;--red2:light-dark(#7d0f15,#5c0b10);--gold:#f2c14e;--gold-ink:#3b2a00}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,16px)}
header.top{background:var(--red);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:18px;padding-bottom:18px}
.seal{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;padding:3px;object-fit:contain;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.top h1{margin:0;font-size:clamp(20px,4.6vw,26px);line-height:1.15;font-weight:800;text-wrap:balance}
.top p{margin:2px 0 0;font-size:14px;opacity:.85}
.hero{background:linear-gradient(180deg,var(--red) 0 120px,transparent 120px)}
.cover{position:relative;background:var(--paper);border-radius:18px;overflow:hidden;
box-shadow:0 1px 0 var(--line),0 18px 40px -18px rgba(80,10,14,.45)}
.cover-head{position:relative;background:var(--red2);color:#fff;padding:22px 22px 20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;overflow:hidden}
.cover-head::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
background:radial-gradient(circle,rgba(242,193,78,.35),transparent 65%)}
.big{font-weight:800;font-size:clamp(56px,16vw,96px);line-height:.9;letter-spacing:-.03em;color:var(--gold)}
.big small{display:block;font-size:15px;letter-spacing:0;color:#fff;opacity:.8;font-weight:600;margin-top:6px}
.badge{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.cover-head h2{margin:8px 0 4px;font-size:clamp(18px,4.4vw,26px);line-height:1.2;text-wrap:balance}
.cover-head p{margin:0;font-size:15px;opacity:.85}
.links{list-style:none;margin:0;padding:8px}
.links li+li{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:14px;padding:14px 12px;min-height:60px;text-decoration:none;border-radius:12px}
a.item:hover,a.item:focus-visible{background:light-dark(#fbefe9,#2a2023)}
a.item:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.ico{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:light-dark(#fbe5e1,#3a1d20);color:var(--red)}
:root[data-theme=dark] .ico{color:#ff8a8f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .ico{color:#ff8a8f}}
.ico svg{width:22px;height:22px}
.txt{flex:1}
.txt b{display:block;font-weight:600;line-height:1.35}
.txt>span{display:block;font-size:13px;color:var(--mute)}
.go{flex:none;color:var(--mute);font-size:20px}
.pending{opacity:.65}
.empty{padding:20px;color:var(--mute);font-size:15px}
.tools{display:flex;gap:10px;margin:28px 0 12px;align-items:center;flex-wrap:wrap}
.tools h3{margin:0;font-size:20px;flex:1 1 200px}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 14px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-height:46px}
.search input:focus{outline:3px solid var(--gold);border-color:transparent}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute)}
.shelf{display:grid;gap:10px;margin-bottom:28px}
details.month{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.month summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:64px}
details.month summary::-webkit-details-marker{display:none}
details.month summary:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.spine{flex:none;width:52px;text-align:center;background:var(--red);color:#fff;border-radius:8px;padding:5px 0;line-height:1.05}
.spine b{display:block;font-size:22px;font-weight:800}
.spine span{font-size:12px;opacity:.85}
.sum-t{flex:1}
.sum-t b{display:block;font-weight:600;line-height:1.3}
.sum-t>span{font-size:13px;color:var(--mute)}
.chev{flex:none;transition:transform .2s;color:var(--mute)}
details[open] .chev{transform:rotate(180deg)}
details.month .links{border-top:1px solid var(--line)}
footer{padding:24px 0 40px;color:var(--mute);font-size:13px;text-align:center}
.hide{display:none!important}
.nw{white-space:nowrap}
@media(max-width:600px){.cover-head{grid-template-columns:1fr;gap:6px}@media(prefers-reduced-motion:no-preference){.cover{animation:rise .5s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>

   ]}
];

/* ====== NGUỒN DỮ LIỆU ======
   Mặc định trang đọc file links.csv nằm cùng thư mục (cột: Năm,Tháng,Tiêu đề tháng,Tên link,Link,Loại).
   Muốn đọc từ Google Sheets thì dán ID bảng vào SHEET_ID. Không đọc được thì dùng DATA ở trên. */
const SHEET_ID = "";

const ICONS={
 flipbook:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5.5C6 4 9 4 12 6c3-2 6-2 9-.5V19c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z"/><path d="M12 6v13.5"/></svg>',
 bai:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
 video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
 pdf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>'
};
const LOAI={flipbook:"Ấn phẩm lật trang",bai:"Bài viết",video:"Video",pdf:"Tài liệu PDF"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nb=t=>esc(t).replace(/“([^”]+)”/g,'<span class="nw">“$1”</span>');
const ok=u=>/^https:\/\//i.test(u||"");
const parts=t=>{const [y,m]=t.split("-");return {y,m:String(+m)}};
const now=new Date();const curKey=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");

const cover=document.getElementById("cover");
const shelf=document.getElementById("shelf");
let rest=[];
let months=[];
const render=(DATA)=>{
months=[...DATA].filter(d=>/^\d{4}-\d{2}$/.test(d.thang)).sort((a,b)=>b.thang.localeCompare(a.thang));

const linkList=(links)=>{
  if(!links||!links.length) return '<p class="empty">Chưa có nội dung cho tháng này.</p>';
  return '<ul class="links">'+links.map(l=>{
    const ic=ICONS[l.loai]||ICONS.bai, sub=esc(LOAI[l.loai]||"Liên kết");
    const inner=`<span class="ico">${ic}</span><span class="txt"><b>${nb(l.ten)}</b><span>${ok(l.url)?sub:sub+" · Đang cập nhật"}</span></span>`;
    return ok(l.url)
      ? `<li><a class="item" href="${esc(l.url)}" target="_blank" rel="noopener">${inner}<span class="go" aria-hidden="true">›</span></a></li>`
      : `<li><div class="item pending">${inner}</div></li>`;
  }).join("")+'</ul>';
};


const top=months[0];
if(!top){cover.innerHTML='<p class="empty">Chưa có tin tức nào được cập nhật.</p>';}
else{
  const p=parts(top.thang), isCur=top.thang===curKey;
  cover.id="thang-"+top.thang;
  cover.innerHTML=`<div class="cover-head">
    <div class="big">${esc(p.m.padStart(2,"0"))}<small>Tháng · ${esc(p.y)}</small></div>
    <div><span class="badge">${isCur?"Tháng này":"Số mới nhất"}</span>
    <h2>${nb(top.tieuDe||("Tin tức tháng "+p.m+"/"+p.y))}</h2>
    <p>${esc(top.moTa||"")}${top.moTa?" · ":""}${(top.links||[]).length} nội dung</p></div></div>`+linkList(top.links);
}


rest=months.slice(1);
shelf.innerHTML=rest.length?rest.map(d=>{const p=parts(d.thang);return `<details class="month" id="thang-${esc(d.thang)}" data-s="${esc((d.tieuDe+" "+d.moTa+" "+p.m+"/"+p.y+" tháng "+p.m+" "+(d.links||[]).map(l=>l.ten).join(" ")).toLowerCase())}">
  <summary><span class="spine"><b>${esc(p.m)}</b><span>${esc(p.y)}</span></span>
  <span class="sum-t"><b>${nb(d.tieuDe||("Tin tức tháng "+p.m+"/"+p.y))}</b><span>${(d.links||[]).length} nội dung</span></span>
  <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></summary>
  ${linkList(d.links)}</details>`}).join("")
  :'<p class="empty" id="noold">Các số của những tháng trước sẽ được lưu ở đây.</p>';

};
const q=document.getElementById("q");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase();let n=0;
  shelf.querySelectorAll("details.month").forEach(el=>{const hit=!v||el.dataset.s.includes(v);el.classList.toggle("hide",!hit);if(hit)n++;if(v&&hit)el.open=true;});
  let m=document.getElementById("nores");
  if(v&&!n&&rest.length){if(!m){m=document.createElement("p");m.id="nores";m.className="empty";shelf.appendChild(m);}m.textContent="Không tìm thấy nội dung phù hợp.";}
  else if(m)m.remove();
});

const openHash=()=>{const h=location.hash.slice(1);if(!h)return;const el=document.getElementById(h);if(el){if(el.tagName==="DETAILS")el.open=true;el.scrollIntoView({block:"start"});}};
window.addEventListener("hashchange",openHash);

const parseCSV=t=>{const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}
 else if(c=='"')q=true;else if(c==','){r.push(f);f="";}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f="";}else f+=c;}
 if(f||r.length){r.push(f);rows.push(r);}return rows;};
const kind=v=>{v=(v||"").trim().toLowerCase();if(/flip|lật|ấn phẩm/.test(v))return "flipbook";if(/video/.test(v))return "video";if(/pdf/.test(v))return "pdf";return "bai";};
const fromSheet=rows=>{const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());
 const ix=k=>h.findIndex(x=>x.startsWith(k));const iy=ix("năm"),im=ix("tháng"),it=ix("tiêu đề"),il=ix("tên link"),ik=ix("loại");
 const iurl=h.findIndex(x=>x==="link");const map=new Map();
 rows.forEach(r=>{const y=parseInt(r[iy]),m=parseInt(r[im]);if(!y||!m||m<1||m>12)return;
  const key=y+"-"+String(m).padStart(2,"0");if(!map.has(key))map.set(key,{thang:key,tieuDe:"",moTa:"Số tháng "+m+"/"+y,links:[]});
  const d=map.get(key);if(!d.tieuDe&&r[it])d.tieuDe=r[it].trim();
  if((r[il]||"").trim()||(r[iurl]||"").trim())d.links.push({ten:(r[il]||"").trim()||"Tin tức tháng "+m+"/"+y,url:(r[iurl]||"").trim(),loai:kind(r[ik])});});
 return [...map.values()];};
render(DATA);openHash();
{
 const src=SHEET_ID?"https://docs.google.com/spreadsheets/d/"+encodeURIComponent(SHEET_ID)+"/gviz/tq?tqx=out:csv&t="+Date.now():"links.csv?t="+Date.now();
 fetch(src,{cache:"no-store"})
  .then(r=>{if(!r.ok)throw 0;return r.text();})
  .then(t=>{const d=fromSheet(parseCSV(t));if(d.length){render(d);q.dispatchEvent(new Event("input"));openHash();}})
  .catch(()=>{});
}
}
</script>
</body>
</html>
